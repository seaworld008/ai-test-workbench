name: Bug Report / 问题反馈
description: Report a bug in ai-test-workbench CLI, templates, quality gates, or Agent Skill
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请附上真实命令输出与版本信息（切勿粘贴真实密码、Cookie 或 `.env` 密钥）。
  - type: input
    id: env
    attributes:
      label: Environment (OS / Node / Playwright)
      description: Output of `npx ai-test-workbench@6.1.0 doctor`
      placeholder: "Windows 11 pwsh / Node v26.11.0 / @playwright/test 1.65.1"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Command & Reproduction Steps / 复现命令与步骤
      placeholder: |
        1. npx ai-test-workbench@6.1.0 ...
        2. Exit code & error output
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior / 预期与实际结果
    validations:
      required: true
