name: Release npm Package

# Triggered ONLY when a human pushes a semver release tag (e.g., v6.2.0).
# Trusted Publishing (OIDC) is active on npmjs.com:
#   - Package: ai-test-workbench
#   - Repository: seaworld008/ai-test-workbench
#   - Workflow filename: release.yml
#   - Authentication: GitHub Actions OIDC (id-token: write) via Node 24 (npm >= 11.5.1) — zero NPM_TOKEN secret required.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24 LTS (npm >= 11.5.1 for native OIDC Trusted Publishing)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Tag v${TAG_VER} does not match package.json version ${PKG_VER}."
            exit 1
          fi

      - name: Install Root Dev Dependencies (Strict TypeCheck)
        run: npm ci --no-audit --no-fund

      - name: Install QA Template Locked Dependencies & Chromium
        working-directory: templates/playwright-qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Full Verification Gates
        run: |
          npm run check:vendor
          npm run lint:docs
          npm run typecheck
          npm test
          npm run smoke
          npm run demo:verify
          npm run bench
          node scripts/bench-agentic.mjs --fast
          npm pack --dry-run

      - name: Build Verified npm Tarball Artifact
        run: |
          mkdir -p release-dist
          npm pack --pack-destination release-dist

      - name: Upload Tarball Artifact for OIDC Publish Job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release-tarball
          path: release-dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Setup Node.js 24 LTS (npm >= 11.5.1 for native OIDC Trusted Publishing)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Download Verified npm Tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release-tarball
          path: release-dist

      - name: Publish Pre-Built Tarball to npm via OIDC Trusted Publishing with Sigstore Provenance
        run: |
          npm --version
          set -- ./release-dist/*.tgz
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one tarball under ./release-dist, got: $*"
            exit 1
          fi
          npm publish "$1" --provenance --access public
