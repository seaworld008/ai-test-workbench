name: Release npm Package

# Triggered ONLY when a human pushes a semver release tag (e.g., v5.1.1).
# Trusted Publishing (OIDC) is active on npmjs.com:
#   - Package: ai-test-workbench
#   - Repository: seaworld008/ai-test-workbench
#   - Workflow filename: release.yml
#   - Authentication: GitHub Actions OIDC (id-token: write) via Node 24 (npm >= 11.5.1) — zero NPM_TOKEN secret required.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 24 LTS (npm >= 11.5.1 for native OIDC Trusted Publishing)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify tag matches package.json version
        run: |
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "Tag v${TAG_VER} does not match package.json version ${PKG_VER}."
            exit 1
          fi

      - name: Install QA Template Locked Dependencies & Chromium
        working-directory: templates/playwright-qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Full 7-Command Verification Gate
        run: |
          npm run lint:docs
          npm run typecheck
          npm test
          npm run smoke
          npm run demo:verify
          npm run bench
          npm pack --dry-run

      - name: Publish to npm via OIDC Trusted Publishing with Sigstore Provenance
        run: |
          npm --version
          npm publish --provenance --access public
