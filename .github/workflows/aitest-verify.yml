name: AI Test Workbench Reusable Verify & T2 Attestation

# Reusable verification workflow (`workflow_call`) for producing T2 merge-grade verdicts.
#
# Trust Level Policy:
# - T0: Unverified local run (not a merge-grade green).
# - T1: Local Run Ledger + MAC (proves integrity, not provenance; not a merge-grade green).
# - T2: Re-run from a clean checkout on a GitHub-hosted runner, keylessly signed with Sigstore,
#       and verified for issuer identity. ONLY T2 is a merge-grade green.
#
# Private Repository Signing Notes:
# - `signer: github-attest` (default) uses GitHub Artifact Attestations (`actions/attest`), which
#   requires GitHub Enterprise Cloud for private repositories.
# - `signer: cosign` uses public Sigstore keyless signing (`cosign attest-blob`), which records the
#   repository and workflow identity in the public Rekor transparency log. Private projects must
#   evaluate that public log disclosure before selecting `cosign`.

on:
  workflow_call:
    inputs:
      target:
        description: 'Target repository root directory relative to checkout root'
        required: false
        type: string
        default: '.'
      qa-dir:
        description: 'Path to isolated QA workspace directory (e.g., qa)'
        required: false
        type: string
        default: 'qa'
      suite:
        description: 'Verification suite/mode: impact | full | smoke | e2e | api | a11y | critical'
        required: false
        type: string
        default: 'impact'
      base-ref:
        description: 'Optional Git base ref for AST Semantic Diff Guard & Impact (defaults to merge-base / HEAD~1)'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node.js major version (>= 22)'
        required: false
        type: string
        default: '22'
      signer:
        description: 'Sigstore keyless signer backend: github-attest | cosign'
        required: false
        type: string
        default: 'github-attest'
      workbench-version:
        description: 'Pinned ai-test-workbench npm version'
        required: false
        type: string
        default: '6.7.0'
      use-local-cli:
        description: 'Internal self-bootstrap option: execute ./tools/aitest.mjs instead of npx'
        required: false
        type: boolean
        default: false
      bootstrap-from-template:
        description: 'Internal self-bootstrap option: scaffold ephemeral QA workspace from templates/playwright-qa'
        required: false
        type: boolean
        default: false
    outputs:
      verdict:
        description: 'Three-state verification verdict: pass | fail | blocked'
        value: ${{ jobs.verify.outputs.verdict }}
      attestation-path:
        description: 'Workspace-relative path to generated attestation.json'
        value: ${{ jobs.verify.outputs.attestation-path }}
      bundle-path:
        description: 'Path to generated Sigstore signature bundle (present only when verdict=pass)'
        value: ${{ jobs.attest.outputs.bundle-path }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.verify.outputs.verdict }}
      verify-exit: ${{ steps.verify.outputs.verify-exit }}
      attestation-path: ${{ steps.verify.outputs.attestation-path }}
      predicate-path: ${{ steps.verify.outputs.predicate-path }}
      sarif-path: ${{ steps.verify.outputs.sarif-path }}
      signer: ${{ steps.verify.outputs.signer }}

    steps:
      - name: Checkout clean repository (full history for merge-base diff)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Validate workflow inputs
        shell: bash
        env:
          INPUT_SIGNER: ${{ inputs.signer }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_QA_DIR: ${{ inputs.qa-dir }}
          INPUT_BASE_REF: ${{ inputs.base-ref }}
          INPUT_WB_VER: ${{ inputs.workbench-version }}
        run: |
          for val in "$INPUT_SIGNER" "$INPUT_SUITE" "$INPUT_TARGET" "$INPUT_QA_DIR" "$INPUT_BASE_REF" "$INPUT_WB_VER"; do
            case "$val" in
              *$'\n'*|*$'\r'*) echo "Newlines are forbidden in workflow inputs"; exit 1 ;;
            esac
          done
          if [ "$INPUT_SIGNER" != "github-attest" ] && [ "$INPUT_SIGNER" != "cosign" ]; then
            echo "Invalid signer '${INPUT_SIGNER}'. Allowed values: github-attest, cosign."
            exit 1
          fi

      - name: Install QA dependencies & Chromium
        shell: bash
        env:
          INPUT_QA_DIR: ${{ inputs.qa-dir }}
        run: |
          if [ -f "${INPUT_QA_DIR}/package-lock.json" ]; then
            cd "${INPUT_QA_DIR}"
            npm ci --no-audit --no-fund
            npx playwright install --with-deps chromium
          fi

      - name: Prepare ephemeral workspace when self-bootstrapping template
        id: prep
        shell: bash
        env:
          INPUT_BOOTSTRAP: ${{ inputs.bootstrap-from-template }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_QA_DIR: ${{ inputs.qa-dir }}
        run: |
          node -e "
            const fs = require('node:fs');
            const out = process.env.GITHUB_OUTPUT;
            const sanitize = (s) => String(s || '').replace(/[\r\n]/g, '');
            const t = sanitize(process.env.INPUT_TARGET);
            const q = sanitize(process.env.INPUT_QA_DIR);
            if (process.env.INPUT_BOOTSTRAP === 'true') {
              const workDir = process.env.RUNNER_TEMP + '/aitest-bootstrap-repo';
              fs.rmSync(workDir, { recursive: true, force: true });
              fs.mkdirSync(workDir, { recursive: true });
            } else {
              fs.appendFileSync(out, 'target-dir=' + t + '\n');
              fs.appendFileSync(out, 'qa-dir=' + q + '\n');
            }
          "
          if [ "${INPUT_BOOTSTRAP}" = "true" ]; then
            WORK_DIR="${RUNNER_TEMP}/aitest-bootstrap-repo"
            node tools/aitest.mjs init --name self-bootstrap --target "$WORK_DIR" --skip-install --loop none --lang en
            git -C "$WORK_DIR" init
            git -C "$WORK_DIR" config user.email "ci-bootstrap@ai-test-workbench.local"
            git -C "$WORK_DIR" config user.name "CI Bootstrap"
            git -C "$WORK_DIR" add .
            git -C "$WORK_DIR" commit -m "chore: bootstrap baseline"
            ln -s "${GITHUB_WORKSPACE}/${INPUT_QA_DIR}/node_modules" "$WORK_DIR/qa/node_modules"
            printf 'target-dir=%s\nqa-dir=%s/qa\n' "$WORK_DIR" "$WORK_DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Execute ai-test-workbench verify-change
        id: verify
        shell: bash
        env:
          TARGET_DIR: ${{ steps.prep.outputs.target-dir }}
          QA_DIR: ${{ steps.prep.outputs.qa-dir }}
          INPUT_SUITE: ${{ inputs.suite }}
          INPUT_BASE_REF: ${{ inputs.base-ref }}
          INPUT_WB_VER: ${{ inputs.workbench-version }}
          INPUT_USE_LOCAL: ${{ inputs.use-local-cli }}
          INPUT_SIGNER: ${{ inputs.signer }}
        run: |
          set +e
          OUT_JSON="${RUNNER_TEMP}/verify-change-output.json"
          ARGS=(verify-change --target "${TARGET_DIR}" --qa-dir "${QA_DIR}" --suite "${INPUT_SUITE}" --json)
          if [ -n "${INPUT_BASE_REF}" ]; then
            ARGS+=(--base "${INPUT_BASE_REF}")
          fi
          if [ "${INPUT_USE_LOCAL}" = "true" ]; then
            node tools/aitest.mjs "${ARGS[@]}" > "$OUT_JSON"
          else
            npx "ai-test-workbench@${INPUT_WB_VER}" "${ARGS[@]}" > "$OUT_JSON"
          fi
          VERIFY_EXIT=$?
          set -e

          node -e "
            const fs = require('node:fs');
            const path = require('node:path');
            const outFile = process.env.GITHUB_OUTPUT;
            const sanitize = (s) => String(s || '').replace(/[\r\n]/g, '');
            const raw = fs.readFileSync(process.argv[1], 'utf8').trim();
            let parsed = { verdict: 'blocked', artifacts: {} };
            try { parsed = JSON.parse(raw); } catch {
              const first = raw.indexOf('{');
              const last = raw.lastIndexOf('}');
              if (first >= 0 && last > first) parsed = JSON.parse(raw.slice(first, last + 1));
            }
            const artifactDir = path.join(process.env.GITHUB_WORKSPACE, 'aitest-ci-artifacts');
            fs.mkdirSync(artifactDir, { recursive: true });
            const artifacts = parsed.artifacts || parsed.data?.artifacts || {};
            const copyIf = (src, destName) => {
              if (!src || !fs.existsSync(src)) return '';
              const dst = path.join(artifactDir, destName);
              fs.copyFileSync(src, dst);
              return path.relative(process.env.GITHUB_WORKSPACE, dst).replace(/\\\\/g, '/');
            };
            const attRel = copyIf(artifacts.attestationPath, 'attestation.json');
            const predRel = copyIf(artifacts.predicatePath, 'verdict-predicate.json');
            const sarifRel = copyIf(artifacts.sarifPath, 'verdict.sarif.json');
            const mdRel = copyIf(artifacts.summaryMdPath, 'verdict-summary.md');
            const verdictRaw = sanitize(parsed.verdict || parsed.data?.verdict || 'blocked');
            const verdict = ['pass', 'fail', 'blocked'].includes(verdictRaw) ? verdictRaw : 'blocked';
            const exitCodeSafe = /^\d+$/.test(String(process.argv[2])) ? String(process.argv[2]) : '2';
            const signerSafe = process.env.INPUT_SIGNER === 'cosign' ? 'cosign' : 'github-attest';
            fs.appendFileSync(outFile, 'verdict=' + verdict + '\n');
            fs.appendFileSync(outFile, 'verify-exit=' + exitCodeSafe + '\n');
            fs.appendFileSync(outFile, 'attestation-path=' + (attRel ? 'aitest-ci-artifacts/attestation.json' : '') + '\n');
            fs.appendFileSync(outFile, 'predicate-path=' + (predRel ? 'aitest-ci-artifacts/verdict-predicate.json' : '') + '\n');
            fs.appendFileSync(outFile, 'sarif-path=' + (sarifRel ? 'aitest-ci-artifacts/verdict.sarif.json' : '') + '\n');
            fs.appendFileSync(outFile, 'summary-path=' + (mdRel ? 'aitest-ci-artifacts/verdict-summary.md' : '') + '\n');
            fs.appendFileSync(outFile, 'signer=' + signerSafe + '\n');
            if (verdict !== 'pass' || process.argv[2] !== '0') {
              console.error('[verify-change output]', raw.slice(0, 2000));
            }
          " "$OUT_JSON" "$VERIFY_EXIT"

      - name: Upload unattested verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aitest-verify-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: aitest-ci-artifacts/
          if-no-files-found: warn
          retention-days: 7

  attest:
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
      security-events: write
    outputs:
      bundle-path: ${{ steps.bundle-path.outputs.bundle-path }}

    steps:
      - name: Download verification artifacts (isolated from untrusted target scripts)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aitest-verify-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: aitest-ci-artifacts

      - name: Validate isolated verification artifacts before OIDC signing (VULN-02 boundary)
        id: validate-artifacts
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          INPUT_BOOTSTRAP: ${{ inputs.bootstrap-from-template }}
          VERIFY_VERDICT: ${{ needs.verify.outputs.verdict }}
          VERIFY_EXIT: ${{ needs.verify.outputs.verify-exit }}
        run: |
          node -e "
            const fs = require('node:fs');
            const outFile = process.env.GITHUB_OUTPUT;
            const attPath = 'aitest-ci-artifacts/attestation.json';
            const predPath = 'aitest-ci-artifacts/verdict-predicate.json';
            const sarifPath = 'aitest-ci-artifacts/verdict.sarif.json';
            const isRegularNonSymlink = (p) => {
              if (!fs.existsSync(p)) return false;
              const st = fs.lstatSync(p);
              return st.isFile() && !st.isSymbolicLink();
            };
            const hasSarif = isRegularNonSymlink(sarifPath);
            fs.appendFileSync(outFile, 'has-sarif=' + (hasSarif ? 'true' : 'false') + '\n');
            if (process.env.VERIFY_VERDICT !== 'pass' || process.env.VERIFY_EXIT !== '0') {
              fs.appendFileSync(outFile, 'attest-ready=false\n');
              process.exit(0);
            }
            if (!isRegularNonSymlink(attPath) || !isRegularNonSymlink(predPath)) {
              console.error('[Attest Security Blocked] Fixed artifact files missing or symlinked.');
              fs.appendFileSync(outFile, 'attest-ready=false\n');
              process.exit(1);
            }
            const doc = JSON.parse(fs.readFileSync(attPath, 'utf8'));
            const pred = JSON.parse(fs.readFileSync(predPath, 'utf8'));
            if (doc._type !== 'https://in-toto.io/Statement/v1') {
              console.error('[Attest Security Blocked] Invalid in-toto statement _type.');
              process.exit(1);
            }
            if (pred.verdict !== 'pass' || doc.predicate?.verdict !== 'pass') {
              console.error('[Attest Security Blocked] Predicate verdict is not pass.');
              process.exit(1);
            }
            const gates = doc.predicate?.gates || {};
            if (gates.governance !== 'pass' || gates.static !== 'pass' || gates.runtime !== 'pass' || gates.semanticDiff !== 'pass') {
              console.error('[Attest Security Blocked] All 4 quality gates must be pass before T2 OIDC attestation:', gates);
              process.exit(1);
            }
            if (Array.isArray(doc.predicate?.gateErrors) && doc.predicate.gateErrors.length > 0) {
              console.error('[Attest Security Blocked] Non-empty gateErrors in predicate.');
              process.exit(1);
            }
            const subjects = Array.isArray(doc.subject) ? doc.subject : [];
            const commitSubj = subjects.find((s) => s && s.name === 'git-commit');
            const attestedSha = String(commitSubj?.digest?.gitCommit || commitSubj?.digest?.sha1 || '').trim().toLowerCase();
            const expectedSha = String(process.env.EXPECTED_SHA || '').trim().toLowerCase();
            if (process.env.INPUT_BOOTSTRAP !== 'true' && (!attestedSha || attestedSha !== expectedSha)) {
              console.error('[Attest Security Blocked] Attested git-commit SHA (' + attestedSha + ') != GITHUB_SHA (' + expectedSha + ').');
              process.exit(1);
            }
            if (JSON.stringify(doc.predicate) !== JSON.stringify(pred)) {
              console.error('[Attest Security Blocked] verdict-predicate.json diverges from attestation.json predicate.');
              process.exit(1);
            }
            fs.appendFileSync(outFile, 'attest-ready=true\n');
          "

      - name: Attest passing verdict with GitHub Artifact Attestations (T2 Sigstore)
        id: github-attest
        if: needs.verify.outputs.signer == 'github-attest' && steps.validate-artifacts.outputs.attest-ready == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: aitest-ci-artifacts/attestation.json
          predicate-type: https://github.com/seaworld008/ai-test-workbench/verdict/v1
          predicate-path: aitest-ci-artifacts/verdict-predicate.json

      - name: Install Cosign (optional keyless Sigstore signer)
        if: needs.verify.outputs.signer == 'cosign' && steps.validate-artifacts.outputs.attest-ready == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        continue-on-error: false

      - name: Attest passing verdict with Cosign keyless attest-blob (T2 Sigstore)
        id: cosign-attest
        if: needs.verify.outputs.signer == 'cosign' && steps.validate-artifacts.outputs.attest-ready == 'true'
        shell: bash
        run: |
          BUNDLE="aitest-ci-artifacts/attestation.sigstore.json"
          cosign attest-blob "aitest-ci-artifacts/attestation.json" \
            --predicate "aitest-ci-artifacts/verdict-predicate.json" \
            --type "https://github.com/seaworld008/ai-test-workbench/verdict/v1" \
            --bundle "$BUNDLE" \
            --yes
          echo "bundle-path=$BUNDLE" >> "$GITHUB_OUTPUT"

      - name: Stage Sigstore signature bundle for artifact upload
        id: bundle-path
        if: always()
        shell: bash
        env:
          GH_BUNDLE: ${{ steps.github-attest.outputs.bundle-path }}
          COSIGN_BUNDLE: ${{ steps.cosign-attest.outputs.bundle-path }}
        run: |
          if [ -n "$GH_BUNDLE" ] && [ -f "$GH_BUNDLE" ]; then
            cp "$GH_BUNDLE" aitest-ci-artifacts/attestation.sigstore.json
            echo "bundle-path=aitest-ci-artifacts/attestation.sigstore.json" >> "$GITHUB_OUTPUT"
          elif [ -n "$COSIGN_BUNDLE" ] && [ -f "$COSIGN_BUNDLE" ]; then
            echo "bundle-path=${COSIGN_BUNDLE}" >> "$GITHUB_OUTPUT"
          else
            echo "bundle-path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload attestation, SARIF, summary & Sigstore bundle artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aitest-verdict-t2-${{ github.run_id }}-${{ github.run_attempt }}
          path: aitest-ci-artifacts/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF report to GitHub Code Scanning
        if: always() && steps.validate-artifacts.outputs.has-sarif == 'true'
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: aitest-ci-artifacts/verdict.sarif.json
          category: ai-test-workbench-verdict

      - name: Enforce Fail-Closed Verdict Gate (fail or blocked MUST fail job)
        shell: bash
        env:
          VERDICT: ${{ needs.verify.outputs.verdict }}
          EXIT_CODE: ${{ needs.verify.outputs.verify-exit }}
          SIGNER: ${{ needs.verify.outputs.signer }}
          BUNDLE_PATH: ${{ steps.bundle-path.outputs.bundle-path }}
        run: |
          if [ "$VERDICT" != "pass" ] || [ "$EXIT_CODE" != "0" ]; then
            echo "[AI Test Workbench CI Gate FAILED] verdict=${VERDICT} exitCode=${EXIT_CODE} (only a passing Sigstore-signed T2 verdict is a merge-grade green)."
            exit 1
          fi
          echo "[AI Test Workbench CI Gate PASSED] verdict=pass signer=${SIGNER} bundle=${BUNDLE_PATH}"
