name: AI Test Workbench CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify-workbench:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run CLI & Guard Unit/Integration Tests
        run: npm test

      - name: Install QA Template Locked Dependencies & Chromium
        working-directory: templates/playwright-qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Run Offline Smoke + 3-Layer Quality Gate
        run: npm run smoke

      - name: Run Full-Stack Local Demo E2E + API Concurrency Verification
        run: npm run demo:verify

      - name: Verify npm Package Tarball Hygiene
        run: npm pack --dry-run

      - name: Upload Template QA Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ matrix.os }}
          path: |
            templates/playwright-qa/playwright-report/
            templates/playwright-qa/reports/
            templates/playwright-qa/test-results/
          retention-days: 7
