name: AI Test Workbench CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  unit-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22', '24', '26']
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify Bilingual Docs, MCP Registry Parity, Claims Mapping & Hygiene
        run: npm run lint:docs

      - name: Run CLI, Adversarial, AST & Governance Unit Tests
        run: npm test

      - name: Run Fast North-Star & Holdout Benchmark (FGER / Holdout / FPR / Triage / Redaction / MisHeal)
        run: node scripts/run-bench.mjs --fast

  verify-e2e-typecheck-and-t2-attestation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install QA Template Locked Dependencies & Chromium
        working-directory: templates/playwright-qa
        run: |
          npm ci --no-audit --no-fund
          npx playwright install chromium

      - name: Run Fail-Closed TypeScript checkJs across src/**/*.mjs & Gate Kernel
        run: npm run typecheck

      - name: Run Full Unit & Live Browser LCP Regression Tests (Zero Skips Allowed)
        run: node --test --test-reporter=spec test/*.test.mjs

      - name: Run Offline Smoke + 4-Layer Quality Gate
        run: npm run smoke

      - name: Run Full-Stack Local Demo E2E + One-Call Verify Change (T2 CI Attestation) + Web Vitals
        run: npm run demo:verify

      - name: Run Live Seeded-Defect & Red-Team Holdout Benchmark (SDDR + FGER + FPR)
        run: npm run bench

      - name: Verify npm Package Tarball Hygiene
        run: npm pack --dry-run

      - name: Upload Template QA Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qa-artifacts-${{ matrix.os }}
          path: |
            templates/playwright-qa/playwright-report/
            templates/playwright-qa/reports/
            templates/playwright-qa/test-results/
          retention-days: 7
